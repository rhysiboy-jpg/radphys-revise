<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadPhys Diagram Sign-off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500..700&family=Noto+Sans:wght@400..600&display=swap">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* Sign-off page: the real diagram modules on one sheet, each with its own checklist. Not published to students. */
  .signoff { max-width: 1180px; margin: 0 auto; }
  .signoff .sheet { margin: 8px; }
  .check { background: var(--sun-tint); border-radius: var(--r-panel); padding: 16px 20px; display: grid; gap: 8px; }
  .check ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
  .check h3 { color: var(--sun-ink); }
</style>
</head>
<body>
<div class="signoff">
  <main class="sheet">
    <section class="title-row">
      <div>
        <h1>Diagram Sign-off</h1>
        <p class="sub">Every diagram as students will see it, built from the app's own code. To approve one, set <b>"approved": true</b> for it in <b>content/topics.json</b>, or tell Claude which ones are signed off.</p>
      </div>
    </section>
    <div data-role="list" class="stack" style="gap:72px"></div>
    <footer class="bottom"><span>RadPhys Revise · Created by Rhys Morris</span><span>Sign-off page · not published</span></footer>
  </main>
</div>
<script type="module">
// Each diagram with what Rhys should check before signing it off.
const DIAGRAMS = [
  { id: "bohr", title: "The Bohr atom", status: "Signed off", checks: [
    "Binding energies for carbon, calcium, iodine, tungsten and lead (K, and the L3 and M5 sub-shells for L and M).",
    "Excitation vs ionisation narration, and the characteristic energy worked as K − L (tungsten ≈ 59.3 keV, to match the spectrum explorer).",
    "Is five elements the right choice, and is the sub-shell simplification acceptable for first years?" ] },
  { id: "target", title: "Electron–target interactions", status: "Signed off", checks: [
    "Heat, Bremsstrahlung and characteristic narration, and the share figures (about 99% heat).",
    "Bremsstrahlung photon energies are illustrative fractions of the kV (8%, 22%, 45%, 75%, 100% for a direct hit). The trend is right; the exact fractions are not physical constants.",
    "Below 69.5 kV: no K-characteristic line, with a note that L lines (8–12 keV) are filtered out." ] },
  { id: "pe-compton", title: "Photoelectric effect and Compton scatter", status: "Signed off", checks: [
    "Compton energies use the full Compton formula; the recoil electron's direction is calculated too.",
    "Below a material's K-shell binding energy (iodine under 33.2 keV, lead under 88 keV) the photoelectric panel switches to the L shell.",
    "\"Which is more likely?\" is illustrative, from Z³/E³, with soft tissue crossing over at about 25 keV and bone at about 47 keV. Are you happy with those figures, or would you rather show the trend without percentages?" ] },
  { id: "isl", title: "The inverse square law", status: "Signed off", checks: [
    "Area, intensity and the mAs–distance rule (mAs₂ = mAs₁ × (d₂ ÷ d₁)²) against the reference distance.",
    "The front view has 144 photons on a grid, so the fixed patch counts exactly 144, 64, 36 and 16 at 100, 150, 200 and 300 cm.",
    "Is linking distance to staff dose (time, distance and shielding) in the right place here?" ] },
  { id: "tube", title: "The rotating-anode tube", status: "Signed off", checks: ["Signed off 29 October 2026. Labels now use Noto Sans after the Bangor restyle (checked 30 October)."] },
  { id: "spectrum", title: "The X-ray spectrum", status: "Signed off", checks: ["Signed off 29 October 2026. Labels now use Noto Sans after the Bangor restyle (checked 30 October)."] },
];
const list = document.querySelector('[data-role="list"]');
for (const d of DIAGRAMS) {
  const s = document.createElement("section");
  s.className = "module";
  s.setAttribute("aria-labelledby", `h-${d.id}`);
  s.innerHTML = `<div class="module-head"><h2 id="h-${d.id}">${d.title} <span class="status ${d.status === "Signed off" ? "ready" : "review"}">${d.status}</span></h2></div>
    <div class="check"><h3>What to check</h3><ul>${d.checks.map(c => `<li>${c}</li>`).join("")}</ul></div>
    <div data-diagram="${d.id}"></div>`;
  list.appendChild(s);
}
const files = { bohr: "bohr", target: "target", "pe-compton": "pecompton", isl: "isl", tube: "tube", spectrum: "spectrum" };
for (const box of document.querySelectorAll("[data-diagram]")) {
  const mod = await import(`../js/diagrams/${files[box.dataset.diagram]}.js`);
  mod.mount(box);
}
</script>
</body>
</html>
